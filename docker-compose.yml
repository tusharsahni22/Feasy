services:
  app:
    image: ${DOCKER_IMAGE:-tusharsahni22/feasy:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: feasy-app
    restart: unless-stopped
    ports:
      - "80:5000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
