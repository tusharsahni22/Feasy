name: CI/CD Pipeline - Build and Push

on:
  push:
    branches:
      - master
      - qa
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Determine Docker Tag and Target Environment
        id: determine_tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "TAG=latest" >> $GITHUB_ENV
            echo "ENV_NAME=prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "TAG=qa" >> $GITHUB_ENV
            echo "ENV_NAME=qa" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "TAG=dev" >> $GITHUB_ENV
            echo "ENV_NAME=dev" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Generate .env file
        run: |
          # Use branch-specific MongoDB URI if configured, else fallback to MONGODB_URI
          if [[ "${{ env.ENV_NAME }}" == "prod" ]]; then
            echo "MONGODB_URI=${{ secrets.MONGODB_URI_PROD || secrets.MONGODB_URI }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET_PROD || secrets.JWT_SECRET }}" >> .env
            echo "CLIENT_URL=${{ secrets.CLIENT_URL_PROD || 'https://app.yourdomain.com' }}" >> .env
            echo "NODE_ENV=production" >> .env
          elif [[ "${{ env.ENV_NAME }}" == "qa" ]]; then
            echo "MONGODB_URI=${{ secrets.MONGODB_URI_QA || secrets.MONGODB_URI }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET_QA || secrets.JWT_SECRET }}" >> .env
            echo "CLIENT_URL=${{ secrets.CLIENT_URL_QA || 'http://qa.yourdomain.com' }}" >> .env
            echo "NODE_ENV=test" >> .env
          else
            echo "MONGODB_URI=${{ secrets.MONGODB_URI_DEV || secrets.MONGODB_URI }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET_DEV || secrets.JWT_SECRET }}" >> .env
            echo "CLIENT_URL=${{ secrets.CLIENT_URL_DEV || 'http://localhost:5173' }}" >> .env
            echo "NODE_ENV=development" >> .env
          fi

          # Common application variables
          echo "PORT=5000" >> .env
          echo "INSTITUTE_NAME=${{ secrets.INSTITUTE_NAME || 'Feasy SaaS' }}" >> .env
          echo "BUSINESS_TYPE=${{ secrets.BUSINESS_TYPE || 'gym' }}" >> .env
          echo "DEFAULT_COUNTRY_CODE=${{ secrets.DEFAULT_COUNTRY_CODE || '91' }}" >> .env

          # Optional WhatsApp and SMS provider credentials
          echo "WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}" >> .env
          echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" >> .env
          echo "WHATSAPP_API_VERSION=${{ secrets.WHATSAPP_API_VERSION || 'v20.0' }}" >> .env
          echo "WHATSAPP_TEMPLATE_NAME=${{ secrets.WHATSAPP_TEMPLATE_NAME }}" >> .env
          echo "SMS_PROVIDER=${{ secrets.SMS_PROVIDER }}" >> .env
          echo "SMS_API_KEY=${{ secrets.SMS_API_KEY }}" >> .env
          echo "SMS_SENDER_ID=${{ secrets.SMS_SENDER_ID }}" >> .env

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            tusharsahni22/feasy:${{ env.TAG }}