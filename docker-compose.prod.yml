services:
  app:
    # Docker Hub image: tusharsahni22/feasy:<tag> (latest, qa, or dev)
    image: ${DOCKER_IMAGE:-tusharsahni22/feasy:latest}
    container_name: feasy-app
    restart: unless-stopped
    ports:
      - "80:5000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

